name: MyTube guardrails

on:
  push:
    branches: [mytube-branding]
  pull_request:
    branches: [mytube-branding]

permissions:
  contents: read

jobs:
  static-guardrails:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.x"

      - name: Check whitespace errors
        run: git diff --check origin/main...HEAD

      - name: Check MyTube ownership and compatibility guardrails
        run: python3 tools/mytube/check_independence.py
