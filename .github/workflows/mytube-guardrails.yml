name: MyTube guardrails

on:
  push:
    branches: [mytube-branding]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: mytube-guardrails-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-guardrails:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          sparse-checkout: |
            /LICENSE
            /LICENSE.chromium_os
            /AUTHORS
            /starboard/LICENSE
            /cobalt/browser/BUILD.gn
            /cobalt/browser/cobalt_browser_interface_binders.cc
            /cobalt/browser/mytube_platform_api/
            /cobalt/browser/h5vcc_tizentube/
            /cobalt/android/BUILD.gn
            /cobalt/android/apk/app/src/main/java/dev/cobalt/coat/
            /cobalt/shell/android/BUILD.gn
            /cobalt/shell/android/java/res/drawable/
            /cobalt/shell/android/java/res/drawable-*/
            /cobalt/shell/android/shell_apk/
            /tools/mytube/
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.x"

      - name: Check whitespace errors
        run: git diff --check origin/main...HEAD

      - name: Check MyTube ownership and compatibility guardrails
        run: python3 tools/mytube/check_independence.py
